# Test database (H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Force schema creation BEFORE Hibernate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Disable Flyway
spring.flyway.enabled=false

# Mock EVR
evr.base-url=http://localhost/fake
evr.secret-key=test-secret
evr.receiver-code=000000
evr.place-of-delivery-code=TEST
