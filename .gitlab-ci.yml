stages:
  - build
  - test
  - deploy

# --- Backend Build ---
backend-build:
  stage: build
  image: gradle:8.3-jdk17
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# --- Backend Tests (placeholder) ---
# --- Backend Tests ---
backend-test:
  stage: test
  image: gradle:8.3-jdk17
  services:
    - name: postgres:17
      alias: postgres
  variables:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/erapuit_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    paths:
      - backend/build/reports/tests/test/
    expire_in: 1 week

# --- Frontend Build ---
frontend-build:
  stage: build
  image: node:lts
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    paths:
      - frontend/build
    expire_in: 1 week

# --- Frontend Tests (placeholder) ---
frontend-test:
  stage: test
  image: node:lts
  script:
    - echo "No frontend tests yet"
  allow_failure: true

# --- Deploy Stage ---
deploy-job:
  stage: deploy
  script:
    - echo "Deploy successful!"
  only:
    - main
